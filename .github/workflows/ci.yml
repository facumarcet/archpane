name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugin
        run: claude plugin validate plugins/archpane
      - name: Test plugin
        run: claude plugin test plugins/archpane
      # The path a user takes: add the marketplace, install from it, check what landed.
      - name: Install from the marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install archpane@archpane
          claude plugin list | grep -q "archpane@archpane"
          installed=$(find "$CLAUDE_CONFIG_DIR/plugins/cache/archpane/archpane" -mindepth 1 -maxdepth 1 -type d | head -1)
          claude plugin validate "$installed"
          test -f "$installed/skills/drawing-pane-diagrams/SKILL.md"
          test -f "$installed/hooks/canvas.tsx"
